<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cat Door View</title>
<style>
  html, body { margin:0; background:#111; color:#eee; font-family:sans-serif; }
  img { width:100%; max-height:85vh; object-fit:contain; background:#000; }
  #msg { padding:12px; }
</style>
</head>
<body>
  <div id="msg">Waiting for snapshots…</div>
  <img id="pic" alt="door">
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <script>
    const msg = document.getElementById("msg");
    const pic = document.getElementById("pic");
    const client = mqtt.connect("wss://broker.hivemq.com:8884/mqtt");
    client.on("connect", () => {
      client.subscribe("hobbot42/catdoor/snap");
      msg.textContent = "Connected, waiting for phone…";
    });
    client.on("message", (t, p) => {
      pic.src = p.toString();
      msg.textContent = "Live snapshot " + new Date().toLocaleTimeString();
    });
    client.on("error", (e) => { msg.textContent = String(e); });
  </script>
</body>
</html>
