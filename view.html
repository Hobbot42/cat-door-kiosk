<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cat Door View</title>
<style>
  html, body { margin:0; background:#111; color:#eee; font-family:sans-serif; }
  video { width:100%; max-height:80vh; background:#000; }
  #msg { padding:12px; font-size:28px; font-weight:700; }
</style>
</head>
<body>
  <div id="msg">Connecting…</div>
  <video id="v" autoplay playsinline muted></video>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script>
    const ROOM = "catdoor-v3";
    const PEER_CFG = { host:"0.peerjs.com", port:443, path:"/", secure:true };
    const msg = document.getElementById("msg");
    const v = document.getElementById("v");
    const dummy = document.createElement("canvas");
    dummy.width = 2; dummy.height = 2;
    dummy.getContext("2d").fillRect(0, 0, 2, 2);
    const dummyStream = dummy.captureStream(1);
    const peer = new Peer(PEER_CFG);
    peer.on("open", () => {
      msg.textContent = "Calling phone…";
      const call = peer.call(ROOM, dummyStream);
      call.on("stream", (s) => { v.srcObject = s; });
      const conn = peer.connect(ROOM);
      conn.on("data", (d) => { msg.textContent = d; });
    });
    peer.on("error", (e) => { msg.textContent = String(e.type || e); });
  </script>
</body>
</html>
