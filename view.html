<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cat Door View</title>
<style>
  html, body { margin:0; background:#111; color:#eee; font-family:sans-serif; }
  video { width:100%; max-height:80vh; background:#000; }
  #msg { padding:12px; }
</style>
</head>
<body>
  <div id="msg">Waiting for the iPhone…</div>
  <video id="v" autoplay playsinline></video>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script>
    const msg = document.getElementById("msg");
    const v = document.getElementById("v");
    const peer = new Peer();
    function tryCall() {
      msg.textContent = "Calling phone…";
      const call = peer.call("hobbot42-catdoor-2026", new MediaStream());
      if (!call) { setTimeout(tryCall, 2000); return; }
      call.on("stream", (s) => { v.srcObject = s; msg.textContent = "Live"; });
      call.on("error", () => setTimeout(tryCall, 2000));
    }
    peer.on("open", tryCall);
    peer.on("error", (e) => { msg.textContent = String(e.type || e); setTimeout(() => location.reload(), 3000); });
  </script>
</body>
</html>
